<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quack 부스 시연</title>
  <!-- 파비콘 요청(/favicon.ico)도 생기지 않도록 빈 아이콘을 넣는다 -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/shell.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <main class="stage">
    <!-- 왼쪽: 폰 프레임.
         data-mode: live(화면 공유) / recording(사전 녹화 영상)
         data-state: 라이브 상태. waiting(처음) / connected(영상 표시 중) / disconnected(끊김)
         data-recording: 녹화 영상 상태. ok / missing(파일 없음·재생 실패) -->
    <section class="phone" data-mode="live" data-state="waiting" data-recording="ok" aria-label="앱 화면">
      <div class="phone-screen">
        <video class="phone-video" muted playsinline autoplay></video>
        <!-- 사전 녹화 영상. R을 누르기 전에는 불러오지 않는다 -->
        <video class="phone-recording" muted playsinline preload="auto"></video>
        <p class="phone-recording-missing">녹화 영상이 없어요 (public/recordings/demo.mp4)</p>
        <!-- 관람객에게 지금 화면이 녹화임을 알린다 -->
        <p class="phone-recording-badge">녹화 영상</p>
        <div class="phone-waiting">
          <img class="phone-waiting-duck" src="assets/animal/duck/baby/base.png" alt="" width="512" height="512">
          <p class="phone-waiting-title" data-show="waiting">곧 앱 화면이 나와요</p>
          <p class="phone-waiting-sub" data-show="waiting">폰 화면을 연결하고 있어요</p>
          <p class="phone-waiting-title" data-show="disconnected">폰 화면 연결이 끊겼어요</p>
          <p class="phone-waiting-sub" data-show="disconnected">C를 눌러 다시 연결해요</p>
          <!-- 발표자용 힌트. 관람객용 버튼은 두지 않는다 -->
          <p class="phone-waiting-hint">C: 폰 화면 연결</p>
        </div>
      </div>
    </section>

    <!-- 오른쪽: 서비스명과 안내 패널 -->
    <section class="side">
      <header class="brand">
        <h1 class="brand-name">Quack</h1>
        <p class="brand-tagline">나만의 튜티가 되어주는 AI 서비스</p>
        <p class="brand-team">토큰에 쌀밥 한 스쿱</p>
      </header>

      <!-- 안내 패널. 문구는 scripts/steps.js에 있고 scripts/guide.js가 채운다 -->
      <article class="guide" data-elapsed="off">
        <div class="guide-top">
          <p class="guide-step"><span class="guide-step-now"></span> / <span class="guide-step-total"></span></p>
          <ol class="guide-progress" aria-hidden="true"></ol>
        </div>
        <div class="guide-body">
          <div class="guide-text">
            <div aria-live="polite">
              <h2 class="guide-title"></h2>
              <p class="guide-desc"></p>
            </div>
            <!-- 2단계에서만 보인다. 다른 단계에서도 자리는 남겨 패널 높이가 바뀌지 않게 한다 -->
            <p class="guide-elapsed">실제 AI가 답하는 중 · <span class="guide-elapsed-time">0:00</span></p>
          </div>
          <div class="guide-duck">
            <img class="guide-duck-sheet" alt="" width="1536" height="256">
          </div>
        </div>
      </article>
    </section>
  </main>

  <!-- 발표자용 키 안내. H로 켜고 끈다. 기본은 꺼짐 -->
  <aside class="keys-help" hidden>
    <span><kbd>←</kbd><kbd>→</kbd> 단계</span>
    <span><kbd>1</kbd>~<kbd>6</kbd> 바로 가기</span>
    <span><kbd>Home</kbd> 처음으로</span>
    <span><kbd>C</kbd> 폰 화면 연결</span>
    <span><kbd>R</kbd> 녹화 영상</span>
    <span><kbd>P</kbd> 재생/정지</span>
    <span><kbd>,</kbd><kbd>.</kbd> 5초 이동</span>
    <span><kbd>L</kbd> 라이브</span>
    <span><kbd>H</kbd> 안내 끄기</span>
  </aside>
</body>
</html>
